## Bed heater and bed-adjacent sensors.

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3

max_power: 0.62
min_temp: 0
max_temp: 121

control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

[bed_mesh]
## Mesh results are written to the SAVE_CONFIG block in printer.cfg,
## not to this file.
speed: 300
horizontal_move_z: 20
mesh_min: 40, 40
mesh_max: 260,260
zero_reference_position: 150,150

fade_start: 0.6
fade_end: 10.0
probe_count: 7,7 # Values should be odd, so one point is directly at bed center
algorithm: bicubic
