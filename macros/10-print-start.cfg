## PRINT_START must accept a TOOL parameter for toolchanger builds.
## Order that works: bed heat -> STOP_CRASH_DETECTION -> home with T0 ->
## QGL -> G28 Z -> bed mesh -> select the print's first tool -> purge.
##
## Configure your slicer to pass: PRINT_START TOOL={initial_tool}
## BED_TEMP=... TOOL_TEMP=...

[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set extruder = params.EXTRUDER|default(240)|float %}
    {% set bed_x = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set bed_y = printer.toolhead.axis_maximum.y|float / 2 %}

    {% if 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("X/Y not homed — run G28 and QUAD_GANTRY_LEVEL first") }
    {% endif %}

    G90
    M104 S150
    M140 S{bed}

    M190 S{bed}
    M109 S150

    G28 Z

    G1 X{bed_x} Y{bed_y} Z20 F6000
    M109 S{extruder}
    G92 E0