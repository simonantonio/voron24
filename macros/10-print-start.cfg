## PRINT_START must accept a TOOL parameter for toolchanger builds.
## Order that works: bed heat -> STOP_CRASH_DETECTION -> home with T0 ->
## QGL -> G28 Z -> bed mesh -> select the print's first tool -> purge.
##
## Configure your slicer to pass: PRINT_START TOOL={initial_tool}
## BED_TEMP=... TOOL_TEMP=...

[gcode_macro PRINT_START]
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    G28 Z
    G90                            ; absolute positioning
    G1 Z20 F3000                   ; move nozzle away from bed
