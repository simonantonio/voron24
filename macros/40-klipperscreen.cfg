## Macros you want to appear as buttons on KlipperScreen.
##
## KlipperScreen shows any [gcode_macro] whose name does NOT start with an
## underscore, so prefix internal helpers with _ to keep the panel clean.
## Add "rename_existing" / description fields here for friendlier labels.

#[gcode_macro DOCK_ALL_TOOLS]
#description: Return every toolhead to its dock
#gcode:
