#####################################################################
#   Voron 2.4 / Tap / StealthChanger
#
#   This file contains INCLUDES ONLY, plus the SAVE_CONFIG block that
#   Klipper appends at the bottom. Never add hardware sections here —
#   they get pushed further from the top every time SAVE_CONFIG runs.
#
#   Load order matters: later definitions override earlier ones.
#####################################################################

# --- Physical machine -----------------------------------------------
[include hardware/*.cfg]

# --- Web interface --------------------------------------------------
# mainsail.cfg provides [virtual_sdcard], [pause_resume], [display_status]
# and the PAUSE / RESUME / CANCEL_PRINT macros. Do NOT define those
# anywhere else in this config.
[include mainsail.cfg]
#[include timelapse.cfg]
#[include KAMP_Settings.cfg]

# --- Toolchanger ----------------------------------------------------
# Installed by klipper-toolchanger-easy. Everything under
# toolchanger/readonly-configs/ is symlinked to the git clone and will be
# overwritten on update — put your changes in toolchanger-config.cfg.
#[include toolchanger/readonly-configs/toolchanger-include.cfg]
#[include toolchanger/toolchanger-config.cfg]

# Only uncomment if toolchanger-include.cfg does NOT already pull in the
# tool configs. Including them twice will throw duplicate-section errors.
#[include toolchanger/tools/*.cfg]

# --- Calibration ----------------------------------------------------
[include calibration/*.cfg]

# --- Behaviour and overrides (LAST) ---------------------------------
# 99-overrides.cfg sorts last inside this glob, so it beats everything.
[include macros/*.cfg]

#####################################################################
#   Klipper appends its SAVE_CONFIG block below this line.
#   Do not edit it by hand.
#####################################################################
